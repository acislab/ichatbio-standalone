[chat]
live = true
down_message = "Sorry, I am currently down for maintenance. Please check back soon."
timeout = 60 # Seconds to wait for the assistant to respond before raising a timeout error
require_auth = false
robo_check = false
assistant_llm = "gpt-5.6-terra"
assistant_reasoning_effort = "medium"
max_cost_per_user_request = 2.0 # In USD
max_tokens_per_assistant_response = 4096
max_characters_per_agent_message = 1024
ichatbio_base_url = "http://localhost:8989"
agents = [
    { id = "data_handler", url = "http://localhost:9090/" },
    { id = "map_maker", url = "http://localhost:9091/" },
    { id = "idigbio", url = "http://localhost:9092/" },
    { id = "gbif", url = "http://localhost:9093/" },
]

[llm_proxy]
only_allow_dictionary_models = false

[llm_proxy.model_dictionary]
"best" = "gpt-5.6-terra"
"fast" = "gpt-5.6-luna"
"fastest" = "gpt-6-luna"
"best-cheap" = "gpt-oss-120b"
"fast-cheap" = "gpt-oss-20b"
"gpt-4.1-unfiltered" = "gpt-4.1-unfiltered"
"gpt-4.1" = "gpt-4.1-unfiltered"

[keycloak]
url = "https://auth.acis.ufl.edu"
realm_name = "iDigBio"
client_id = "chat"

[blob_storage]
url = "http://localhost:8989/blob"

[web_app]
allowed_origins = ["http://localhost:8080", "http://localhost:80"]
